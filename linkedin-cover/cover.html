<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'JB';
        src: url('JetBrainsMono-400.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'JB';
        src: url('JetBrainsMono-500.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'JB';
        src: url('JetBrainsMono-700.woff2') format('woff2');
        font-weight: 700;
      }
      @font-face {
        font-family: 'Geist';
        src: url('Geist-400.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Geist';
        src: url('Geist-500.woff2') format('woff2');
        font-weight: 500;
      }

      :root {
        --bg: #0b0f14;
        --surface: #111820;
        --border: #1f2a36;
        --text: #e6edf3;
        --muted: #8b98a5;
        --accent: #7ee787;
        --highlight: #e3b341;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1584px;
        height: 396px;
        overflow: hidden;
      }
      body {
        position: relative;
        background: var(--bg);
        color: var(--text);
        font-family: 'JB', monospace;
        -webkit-font-smoothing: antialiased;
      }
      /* Faint editor-style rulers: texture without CRT effects. */
      .rulers {
        position: absolute;
        inset: 0;
        background-image: linear-gradient(to right, rgba(31, 42, 54, 0.55) 1px, transparent 1px);
        background-size: 96px 100%;
        mask-image: linear-gradient(to right, transparent 0%, #000 35%, #000 100%);
      }
      .logo {
        position: absolute;
        top: 40px;
        left: 48px;
        font-size: 26px;
        font-weight: 700;
      }
      .logo span {
        color: var(--accent);
      }

      .window {
        position: absolute;
        top: 44px;
        right: 48px;
        width: 1000px;
        height: 308px;
        background: var(--surface);
        border: 2px solid var(--border);
        border-radius: 18px;
        overflow: hidden;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 14px 22px;
        border-bottom: 2px solid var(--border);
        color: var(--muted);
        font-size: 17px;
      }
      .dot {
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: var(--border);
      }
      .bar .title {
        margin-left: 10px;
      }
      .body {
        padding: 22px 40px 0;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .prompt {
        font-size: 21px;
        color: var(--muted);
      }
      .prompt b {
        color: var(--text);
        font-weight: 400;
      }
      h1 {
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.1;
      }
      h1 span {
        color: var(--accent);
      }
      .lead {
        font-family: 'Geist', sans-serif;
        font-size: 25px;
        color: var(--muted);
      }
      .row {
        position: absolute;
        left: 40px;
        right: 40px;
        bottom: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .flags {
        display: flex;
        gap: 10px;
      }
      .flags span {
        white-space: nowrap;
        font-size: 16px;
        color: var(--accent);
        border: 2px solid var(--border);
        border-radius: 8px;
        padding: 5px 12px;
      }
      .url {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--highlight);
        font-size: 21px;
      }
      .url i {
        width: 11px;
        height: 11px;
        border-radius: 50%;
        background: var(--highlight);
      }
    </style>
  </head>
  <body>
    <div class="rulers"></div>
    <div class="logo"><span>~/</span>EvanReynolds</div>

    <div class="window">
      <div class="bar">
        <i class="dot"></i><i class="dot"></i><i class="dot"></i
        ><span class="title">~/EvanReynolds — zsh</span>
      </div>
      <div class="body">
        <p class="prompt">~/EvanReynolds $ <b>whoami</b></p>
        <h1>Software Engineer<span>_</span></h1>
        <p class="lead">Data pipelines, APIs and full-stack web apps.</p>
      </div>
      <div class="row">
        <div class="flags">
          <span>--python</span><span>--sql</span><span>--typescript</span><span>--airflow</span
          ><span>--react</span>
        </div>
        <div class="url"><i></i>evanreynolds.dev</div>
      </div>
    </div>
  </body>
</html>
